<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Starter</title>
    <script>
      // Sets .dark before React loads, so a dark page never flashes light.
      // Mirrors systems/theme/theme-store.ts: same key, same stored shape.
      (function () {
        var theme = 'system';
        try {
          var stored = JSON.parse(localStorage.getItem('ui-theme') || 'null');
          var value = stored && stored.state && stored.state.theme;
          if (value === 'light' || value === 'dark') theme = value;
        } catch (e) {}
        var dark = theme === 'dark';
        if (theme === 'system') {
          try {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          } catch (e) {}
        }
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
